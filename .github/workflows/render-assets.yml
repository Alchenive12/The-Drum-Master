# File: .github/workflows/render-assets.yml
# Renders the 3D UI assets with Blender (headless, Cycles on CPU) and commits the PNGs back to the
# same branch, so they can be reviewed from a phone and by Claude.
# Linux only (1x Actions minutes). Runs on pushes to remote/3d-* branches that touch the scripts,
# or by hand from the Actions tab.

name: Render assets

on:
  push:
    branches: ["remote/3d-*"]
    paths:
      - "assets3d/scripts/**"
      - ".github/workflows/render-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version

      - name: Render knob test
        run: blender -b --factory-startup -P assets3d/scripts/knob_test.py -- --out assets3d/renders/knob_test

      - name: Commit renders to this branch
        run: |
          git config user.name  "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add assets3d/renders
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "renders: knob test from ${GITHUB_SHA::7}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload renders
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: assets3d/renders/
          retention-days: 7
